<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIGE Jaguares</title>
<meta name="description" content="Jaguares de Córdoba Sub-15: partido en vivo, centro de datos, asistencia y progreso del jugador en una sola app.">
<meta name="theme-color" content="#0B4F7C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7FBFE;--surface:#FDFEFF;--surface-2:#EAF4FB;--ink:#0E2A40;--muted:#46607A;--accent:#1874B0;--accent-ink:#fff;--border:#C9E4F4;--brand:#0B4F7C;--brand-2:#7DD3F7;--err:#B42318;--ok:#15803D;--display:"Barlow Condensed",system-ui,sans-serif;--body:"Barlow",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0F0D;--surface:#141A17;--surface-2:#1B2420;--ink:#ECF3EF;--muted:#9DB2A7;--accent:#34D399;--accent-ink:#06261A;--border:#26332D;--brand:#0e5c3b;--brand-2:#34D399;--err:#F87171;--ok:#4ADE80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0F0D;--surface:#141A17;--surface-2:#1B2420;--ink:#ECF3EF;--muted:#9DB2A7;--accent:#34D399;--accent-ink:#06261A;--border:#26332D;--brand:#0e5c3b;--brand-2:#34D399;--err:#F87171;--ok:#4ADE80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input{font:inherit}
.top{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:contain;padding:3px}
.top b{display:block;font:800 1.5rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.top span{font-size:.85rem;opacity:.85}
.top .sp{flex:1}
.ico{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:1.05rem}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px;line-height:1.05}
h1{font-size:1.7rem}h2{font-size:1.25rem}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 12px}
label.f{display:block;font-weight:600;font-size:.9rem;margin:12px 0 0}
label.f input{display:block;width:100%;margin-top:6px;padding:12px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:16px}
.btn{display:block;width:100%;margin-top:16px;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:4px;margin:4px 0 14px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.banner{border-radius:11px;padding:10px 12px;font-size:.9rem;margin:10px 0 0}
.banner.err{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 35%,transparent)}
.banner.warn{background:color-mix(in srgb,#D97706 12%,transparent);border:1px solid color-mix(in srgb,#D97706 40%,transparent)}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;min-height:84px;transition:transform .12s}
.tile:active{transform:scale(.985)}
.tile .em{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--surface-2)}
.tile b{display:block;font:700 1.2rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.tile small{color:var(--muted);font-size:.88rem}
.tile .ar{margin-left:auto;color:var(--muted);font-size:1.3rem}
.tile.big{background:var(--brand);color:#fff;border-color:var(--brand)}
.tile.big small,.tile.big .ar{color:rgba(255,255,255,.8)}
.tile.big .em{background:rgba(255,255,255,.16)}
.hola{margin:2px 0 16px}
.hola p{margin:0;color:var(--muted)}
.pie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;color:var(--muted);font-size:.85rem}
.pie button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 0}
.rol{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);margin-bottom:6px}
</style>
</head><body>
<header class="top"><div class="top-in"><img src="icon-192.png" alt=""><div><b>SIGE Jaguares</b><span>Jaguares de Córdoba · Sub-15</span></div><div class="sp"></div><button class="ico" id="thm" aria-label="Cambiar tema día/noche">◐</button></div></header>
<main id="app"></main>
<script>
"use strict";
const J=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const P=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const D=k=>{try{localStorage.removeItem(k)}catch(e){}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const URL_OK=u=>/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)||/^http:\/\/(localhost|127\.0\.0\.1)/.test(u);
const RUTA={pev:"/partido-en-vivo/",cdd:"/centro-de-datos/",jug:"/centro-de-datos/jugador.html"};
const VERSION_PUENTE=15;

/* Tema: el mismo interruptor que el Centro de datos */
function tema(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
tema(J("cdd1:theme",""));
document.getElementById("thm").onclick=()=>{const osc=matchMedia("(prefers-color-scheme: dark)").matches;const cur=document.documentElement.dataset.theme||(osc?"dark":"light");const nx=cur==="dark"?"light":"dark";tema(nx);P("cdd1:theme",nx)};

/* Enlace de familias (#p=…): trae la dirección del puente, igual que Mi progreso */
function leerEnlace(){const m=/#p=([^&]+)/.exec(location.hash||"");if(!m)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(o&&o.url&&URL_OK(o.url)){P("mp1:url",o.url);P("sige:modo","fam")}}catch(e){}history.replaceState(null,"",location.pathname)}
leerEnlace();
addEventListener("hashchange",()=>{if(/#p=/.test(location.hash)){leerEnlace();S.modo=J("sige:modo",S.modo);S.err="";render()}});

/* ¿Quién está en este teléfono? Se reutilizan las sesiones de las apps (mismo sitio) */
function sesion(){
  const pev=J("pev3:cfg",null);
  if(pev&&pev.url&&pev.clave&&(pev.rol==="dt"||pev.rol==="asis"))return {rol:pev.rol,nombre:pev.nombre||"",url:pev.url};
  const ses=J("mp1:ses",null),url=J("mp1:url","");
  if(ses&&ses.doc&&url){const d=J("mp1:datos",null);return {rol:"fam",nombre:(d&&d.jugador&&(d.jugador.apodo||d.jugador.nombre))||""}}
  return null;
}
const S={modo:J("sige:modo","staff"),err:"",busy:false,ses:sesion(),ver:null};
if(S.ses)P("sige:on",1);

async function post(url,body){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),45000);
  try{return await fetch(url,{method:"POST",body:JSON.stringify(body),signal:ctl.signal}).then(x=>x.json())}
  catch(e){throw new Error("Sin señal o el puente no respondió. Intenta de nuevo.")}finally{clearTimeout(t)}
}
async function entrarStaff(url,clave,nombre){
  if(!URL_OK(url))throw new Error("La URL debe ser la del puente (termina en /exec).");
  const r=await post(url,{clave,op:"quien"});
  if(!r.ok)throw new Error(r.error==="clave_incorrecta"?"La clave no es correcta.":"El puente respondió con un error: "+(r.detalle||r.error));
  if(r.rol==="afic")throw new Error("Esa es la clave del enlace para padres. Las familias entran con el documento y el código del jugador.");
  if(r.rol!=="dt"&&r.rol!=="asis")throw new Error("Usa la clave del DT o la del asistente.");
  const prev=J("pev3:cfg",null),uid=(prev&&prev.uid)||("u_"+Math.random().toString(36).slice(2,10));
  if(prev&&prev.rol==="afic"){D("pev3:mirror");D("pev3:since")}
  P("pev3:cfg",{url,clave,rol:r.rol,uid,nombre});
  P("cdd2:cfg",{url,clave,rol:r.rol,desde:"sige"});D("cdd2:nopev");
  P("sige:on",1);P("sige:modo","staff");
}
const ERRF={acceso_invalido:"El documento o el código no son correctos.",bloqueado:"Demasiados intentos fallidos. Espera 15 minutos e intenta de nuevo.",inactivo:"Este acceso no está activo. Habla con el entrenador.",operacion_desconocida:"El servicio aún no está listo. Avísale al entrenador."};
async function entrarFam(doc,codigo){
  const url=J("mp1:url","");
  if(!url)throw new Error("Primero abre el enlace que te envió el entrenador por WhatsApp.");
  const r=await post(url,{doc,codigo,op:"jugDatos",sinFotos:false});
  if(!r.ok)throw new Error(ERRF[r.error]||"Sin señal o el servidor no respondió. Intenta de nuevo.");
  P("mp1:ses",{doc,codigo});
  P("mp1:datos",{duracion:r.duracion,jugador:r.jugador,club:r.club,proximo:r.proximo,partidos:r.partidos,sesiones:r.sesiones,tests:r.tests,evaluaciones:r.evaluaciones});
  P("mp1:stamp",Date.now());if(r.fotos)P("mp1:fotos",r.fotos);
  P("sige:on",1);P("sige:modo","fam");
}

function vLogin(){
  const fam=S.modo==="fam",url=J("mp1:url","");
  return `<section class="sec"><h1>Bienvenido</h1><p class="hint">Una sola app para el cuerpo técnico, los jugadores y las familias.</p>
  <div class="seg" role="group" aria-label="Tipo de acceso"><button data-m="staff" aria-pressed="${!fam}">Cuerpo técnico</button><button data-m="fam" aria-pressed="${fam}">Jugador o familia</button></div>
  ${fam?(url?`<p class="hint">Escribe el número de documento del jugador y el código personal de 6 dígitos que te envió el entrenador.</p>
    <form id="fF"><label class="f">Número de documento<input id="fDoc" inputmode="numeric" autocomplete="off" required value="${esc(S.preDoc||"")}"></label>
    <label class="f">Código personal<input id="fCod" inputmode="numeric" maxlength="6" autocomplete="off" required></label>
    ${S.err?`<div class="banner err">${esc(S.err)}</div>`:""}
    <button class="btn pri" ${S.busy?"disabled":""}>${S.busy?"Verificando…":"Entrar"}</button></form>`
    :`<p>Para entrar, abre el enlace que te envió el entrenador por WhatsApp. Después podrás entrar desde aquí.</p>`)
  :`<p class="hint">Usa la URL del puente y la clave del DT o la del asistente.</p>
    <form id="fS"><label class="f">URL del puente<input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" value="${esc((S.pre&&S.pre.u)||(J("pev3:cfg",null)||{}).url||(J("cdd2:cfg",null)||{}).url||"")}" required></label>
    <label class="f">Clave<input id="sCla" type="password" autocomplete="off" required></label>
    <label class="f">Tu nombre<input id="sNom" placeholder="Ej. Juan Pablo" value="${esc((S.pre&&S.pre.nm)||(J("pev3:cfg",null)||{}).nombre||"")}"></label>
    ${S.err?`<div class="banner err">${esc(S.err)}</div>`:""}
    <button class="btn pri" ${S.busy?"disabled":""}>${S.busy?"Verificando…":"Entrar"}</button></form>`}
  </section>`;
}
function tile(href,em,t,sub,big){return `<a class="tile${big?" big":""}" href="${href}"><span class="em" aria-hidden="true">${em}</span><span><b>${t}</b><small>${sub}</small></span><span class="ar" aria-hidden="true">›</span></a>`}
function saludo(){const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches"}
function vHome(){
  const s=S.ses,nom=s.nombre?", "+esc(s.nombre.split(/\s+/)[0]):"";
  const rol={dt:"Director técnico",asis:"Asistente",fam:"Jugador · familia"}[s.rol];
  let t="";
  if(s.rol==="dt")t=tile(RUTA.pev,"⚽","Partido en vivo","Convocatoria, alineación y marcador en directo",1)+tile(RUTA.cdd,"📊","Centro de datos","Plantilla, sesiones, tests, informes y accesos")+tile(RUTA.cdd+"#registrar","✅","Tomar asistencia","Registrar la sesión de hoy")+tile(RUTA.cdd+"#comunidad","🏆","Comunidad","Perfiles, publicaciones y anuncios por aprobar");
  else if(s.rol==="asis")t=tile(RUTA.pev,"⚽","Partido en vivo","Registrar el partido junto al DT",1)+tile(RUTA.cdd,"✅","Tomar asistencia","Registrar la sesión de entrenamiento");
  else t=tile(RUTA.jug,"📈","Mi progreso","Asistencia, minutos, tests y evaluaciones",1)+tile(RUTA.jug+"#vivo","🔴","Partido en vivo","Marcador y jugadas al instante")+tile(RUTA.jug+"#muro","🏆","Muro del equipo","Logros, anuncios y publicaciones")+tile(RUTA.jug+"#equipo","👥","Mis compañeros","Perfiles, apodos y gustos");
  const aviso=s.rol==="dt"&&S.ver!=null&&S.ver<VERSION_PUENTE?`<div class="banner warn">El puente está en la versión ${S.ver}. Pega el código v${VERSION_PUENTE} en Apps Script y publica una versión nueva para activar todo.</div>`:"";
  return `<div class="hola"><span class="rol">${rol}</span><h1>${saludo()}${nom}</h1><p>¿Qué vamos a hacer hoy?</p></div>${aviso}<div class="tiles">${t}</div>
  <div class="pie"><span>SIGE Jaguares v3.0</span><button id="salir">Cerrar sesión en este teléfono</button></div>`;
}
function render(){
  document.getElementById("app").innerHTML=S.ses?vHome():vLogin();
  const fs=document.getElementById("fS"),ff=document.getElementById("fF");
  if(fs)fs.onsubmit=async e=>{e.preventDefault();const u=document.getElementById("sUrl").value.trim(),k=document.getElementById("sCla").value.trim(),nm=document.getElementById("sNom").value.trim();S.pre={u,nm};S.busy=true;S.err="";render();try{await entrarStaff(u,k,nm);S.ses=sesion();ping()}catch(x){S.err=x.message}S.busy=false;render()};
  if(ff)ff.onsubmit=async e=>{e.preventDefault();const doc=document.getElementById("fDoc").value.trim(),cod=document.getElementById("fCod").value.replace(/\D/g,"");if(!doc||cod.length!==6){S.err="Escribe el número de documento y el código de 6 dígitos.";render();return}S.preDoc=doc;S.busy=true;S.err="";render();try{await entrarFam(doc,cod);S.ses=sesion()}catch(x){S.err=x.message}S.busy=false;render()};
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.modo=b.dataset.m;S.err="";P("sige:modo",S.modo);render()});
  const sl=document.getElementById("salir");
  if(sl)sl.onclick=()=>{if(!confirm("¿Cerrar sesión? Se borrará el acceso guardado en este teléfono para todas las apps."))return;
    ["pev3:cfg","pev3:mirror","pev3:since","cdd2:cfg","cdd2:snap","sige:on"].forEach(D);
    Object.keys(localStorage).filter(k=>k.indexOf("mp1:")===0&&k!=="mp1:url").forEach(D);
    S.ses=null;render()};
}
async function ping(){const c=J("pev3:cfg",null);if(!c||c.rol!=="dt"||!navigator.onLine)return;try{const r=await post(c.url,{clave:c.clave,op:"ping"});if(r.ok){S.ver=+r.version||0;render()}}catch(e){}}
render();ping();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>

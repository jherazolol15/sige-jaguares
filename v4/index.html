<style>

.nt-it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}.nt-it:first-child{border-top:0}.nt-it .pt{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}.nt-it.leida .pt{background:transparent}.nt-it.leida b{font-weight:600}

.ico.spin{animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

.big{font:800 2.1rem/1 var(--display);letter-spacing:.02em}

.vs .dd b{display:block;font:800 1.5rem/1 var(--display)}
.vs .dd small{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.vs .rv{font:700 1.25rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.88rem}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.kp div{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.kp b{display:block;font:800 1.5rem/1 var(--display)}
.kp span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tb-ct{display:flex;flex-wrap:wrap;gap:6px 16px}
.tb-aviso{background:color-mix(in srgb,#D97706 14%,transparent);border-radius:10px;padding:10px 12px;margin-top:6px;font-weight:600}
.tb-dia{border-top:1px solid var(--border);padding:10px 0}.tb-dia:first-of-type{border-top:0}.tb-dia.hoy{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px;padding:10px;margin:4px -10px}
.tb-dh{display:flex;flex-direction:column;margin-bottom:4px}.tb-bl{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;padding:5px 0;font-size:.95rem}.tb-bl .tb-g{text-align:center;margin-top:1px}.tb-hd{display:flex;flex-direction:column;min-width:0}.tb-hd .sub{font-size:.84rem;line-height:1.3}.tb-h{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.tb-g{border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.tb-gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tb-gr>div{border:2px solid;border-radius:12px;padding:10px}.tb-gr ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}.tb-gr li.yo{font-weight:800;color:var(--accent)}
.tb-rg{margin:0;padding-left:22px;display:grid;gap:8px;font-size:.95rem}.tb-ok{color:var(--ok);font-weight:700;margin:12px 0 0}
.tb-niv{margin-top:8px}.tb-niv>b{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;color:#fff}.n-Leve{background:#1874B0}.n-Media{background:#B45309}.n-Grave{background:#B42318}
.tb-mu{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--border)}
.tb-f{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-weight:600;font-size:.9rem}.tb-ed input,.tb-ed select,.tb-ed textarea{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);width:100%;box-sizing:border-box}
.tb-row{display:flex;gap:6px;align-items:center;margin-top:6px}.tb-blk input[type=time]{width:auto;flex:1}.tb-blk select{width:auto}.tb-blk input:not([type]){flex:1}
.fchip{border:1px solid var(--border);background:var(--surface);color:inherit;border-radius:999px;padding:7px 12px;min-height:44px;display:inline-flex;align-items:center;font:700 .85rem/1 var(--body);cursor:pointer}.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.row{display:flex;flex-wrap:wrap}
.tb-bl2{padding:2px 0;font-size:.95rem}.tb-mi{border:2px solid var(--accent)}.tb-mig{border:2px dashed var(--accent)}
.tb-asig{display:grid;gap:4px;margin-top:6px}.tb-as{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;font-size:.92rem;padding:4px 0;border-top:1px solid var(--border)}.tb-as label{display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:.8rem}.tb-as>span{min-width:0;overflow-wrap:anywhere}.tb-as label input{display:none}.tb-as label.on.g1{background:#1874B0;color:#fff;border-color:#1874B0}.tb-as label.on.g0{background:var(--surface-2)}.tb-as label.on.g2{background:#15803D;color:#fff;border-color:#15803D}
.tb-edd{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:10px}.tb-chk{display:grid;gap:4px;margin-top:6px;font-size:.9rem}.tb-chk label{display:flex;gap:10px;align-items:center;min-height:44px}.tb-chk input{width:24px;height:24px;flex:none}
.lst{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.vig{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.vig .falta{margin-left:auto;color:var(--warn-t);white-space:nowrap}
.sem{width:12px;height:12px;border-radius:50%;flex:none}.sem.s2{background:var(--err)}.sem.s1{background:#D97706}
.hist{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}.hist .rs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hist .rs span{border-radius:8px;padding:4px 8px;font-size:.8rem;font-weight:700;background:var(--surface-2)}
.hist .rs i{font-style:normal;display:inline-block;min-width:18px;text-align:center;border-radius:5px;color:#fff;margin-right:5px}.hist .rG{background:#15803D}.hist .rE{background:#B45309}.hist .rP{background:#B42318}
.lst li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:9px 11px}
.chip{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 8px;flex:none}
.chip.les{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err)}
.chip.sus{background:color-mix(in srgb,#D97706 18%,transparent);color:var(--warn-t)}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok-t)}
.chip.vis{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-t)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lst li input{border:1px solid var(--border);border-radius:8px;padding:7px 6px;background:var(--surface);color:inherit;font:inherit;text-align:center}
.empty{color:var(--muted);margin:4px 0 0}
.pie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:.82rem}
.menu{display:grid;gap:8px}.mas-t{margin:16px 2px 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.adp-li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}.adp-li:last-child{border-bottom:0}.ins-paso{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}.ins-paso b.n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:.85rem}
.menu button,.menu a{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--ink);cursor:pointer;text-decoration:none}
.menu .em{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:1.25rem;background:var(--surface-2)}
.menu b{display:block;font:700 1.08rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.menu small{color:var(--muted);font-size:.85rem}
.menu .peligro b{color:var(--err)}
/* Barra inferior por rol */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:620px;margin:0 auto;display:flex;height:var(--nav)}
.nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 .72rem/1 var(--body);letter-spacing:.02em;cursor:pointer;position:relative}
.nav button.chico{flex:.72}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .pt{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#C4321F;color:#fff;font:700 .68rem/17px var(--body)}
/* Módulos: las apps probadas, cada una en su propio marco aislado */
/* Módulos propios (etapa 3 en adelante): código probado montado en su propio Shadow DOM */
#modulos{display:none}
body.en-modulo #modulos{display:block}
/* El CSS del módulo pone :host{display:block}; sin esta regla, el módulo oculto seguía visible encima del otro */
#modulos>[hidden]{display:none!important}
body.en-modulo .top,body.en-modulo main{display:none}
.cargando{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);font-weight:600;pointer-events:none}
.cargando.on{display:grid}
/* v4.20 · aviso breve único (role=status): siempre en el documento, visible solo con .on */
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;text-align:center;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* v4.10 · Invitado: solo el partido en vivo */
.inv-box{text-align:center}.inv-box p{margin:0 0 4px}
.board{background:var(--brand);color:#fff;border-radius:16px;padding:16px 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin-bottom:12px}
.board .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.board .tm img{width:52px;height:52px;object-fit:contain}.board .tm .esc{font-size:2rem;line-height:52px}
.board .sc{font:800 2.8rem/1 var(--display);white-space:nowrap}
.board .sc small{display:block;font:700 .8rem/1.2 var(--body);letter-spacing:.04em;opacity:.85;margin-top:6px}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-left:5px;vertical-align:middle;animation:lp 1.2s infinite}@keyframes lp{50%{opacity:.25}}
.tl{display:flex;flex-direction:column;gap:10px}
.tl .ev{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:start}
.tl .ev .m{font:800 1.05rem/1.3 var(--display);color:var(--accent)}
.tl .ev p{margin:2px 0 0;color:var(--ink);font-size:.92rem}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rx button{border:1px solid var(--border);background:var(--surface);color:inherit;border-radius:999px;padding:4px 12px;min-height:44px;min-width:44px;font-size:1rem;cursor:pointer}
.rx button b{font-size:.85rem;margin-left:4px}
.plantel p{margin:0 0 10px}
/* v4.17 · pulido de app instalada: sin destello al tocar, sin retraso de toque, sin selección en controles,
   sin zoom de iOS en campos, sin recarga accidental al arrastrar hacia abajo (hay botón ↻) */
html{-webkit-tap-highlight-color:transparent}
button,a,[role="button"],label,select,summary{touch-action:manipulation}
.btn,.fchip,.seg button,.rx button,.ico,.nav,.nav button,.menu button,.menu a,.vig,.tb-as label,.tgl,.tb-chk label,.nt-x{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input:not([type="checkbox"]):not([type="radio"]),select,textarea{font-size:max(16px,1em)}
.btn:not(:disabled):active,.fchip:active,.seg button:active,.rx button:active,.ico:active,.menu button:active,.menu a:active,.nav button:active,.tb-as label:active,.vig:active{opacity:.78}
@media (max-width:400px){.top{padding-left:12px;padding-right:12px}.top-in{gap:6px}.top-in>div:not(.sp){min-width:0}.top img{flex:none}.top span{font-size:.74rem}}

/* ===== v4.19 · un solo diseño: componentes comunes (mismo texto en el núcleo y en los tres módulos) ===== */
h1{font-size:1.7rem}h2{font-size:1.55rem}h3{font-size:1.1rem}
.btn{min-height:48px;border-radius:12px}
.btn.sm{min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.chip{padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase}
.sec{padding:14px;border-radius:14px}
.banner{border-radius:12px;font-size:.92rem}
.empty,.empty-state{color:var(--muted);font-size:.92rem;margin:0}
.empty{padding:6px 0}
.lst li,.li,.tl li,.chk li{border-radius:12px}

<script>
(function(){
"use strict";
/* ================= SIGE Jaguares v4.0 · Etapa 2: núcleo =================
   Una sola sesión, una sola capa de acceso al puente, una sola cola sin señal,
   tema y navegación por rol. Los módulos (Partido, Datos, Comunidad, Asistencia,
   Progreso) son por ahora las apps probadas, cada una en su marco aislado. */
const VERSION="4.22.0 · experiencia";
const VERSION_PUENTE=31;
// v4.10 · Dirección del puente para invitados (ver el partido sin cuenta). Las demás operaciones siguen pidiendo clave o código.
const PUENTE_PUBLICO="https://script.google.com/macros/s/AKfycbzE81DeMCxgTfEIEpSzH5N47owZC8BQ5GPS6hRWzCrZFEJvvtEIxU4Ruhd3FFqqGpIh/exec";

const J=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const P=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const URL_OK=u=>/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(u);
const $=id=>document.getElementById(id);

/* ---------- Enlaces especiales ---------- */
// v4.16 · Etapa 7: los enlaces viejos se abren aquí mismo (Partido en vivo ya no existe aparte).
//   #ver=… (enlace de padres) → entra como invitado al partido en vivo.
//   #inv=… (invitación al asistente) → formulario del cuerpo técnico con la URL y la clave ya puestas.
const REDIR=false;
const ENLACE=(()=>{const m=/^#(ver|inv)=([^&]+)/.exec(location.hash||"");if(!m)return null;let o=null;try{o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[2])))))}catch(e){}history.replaceState(null,"",location.pathname);const r={tipo:m[1],url:o&&URL_OK(o.url||"")?o.url:"",clave:o&&o.clave?String(o.clave):""};if(r.tipo==="ver"&&r.url)P("sige4:verUrl",r.url);return r})();
// Enlace de familias (#p=…): trae la dirección del puente.
// Enlace fijo del formulario de bienestar (#p=…&ir=bienestar o #/bienestar): abre Progreso en el formulario
function leerBien(){if(/[#&]ir=bienestar|^#\/bienestar$/.test(location.hash||"")){P("mp1:abrirBien",1);P("mp1:tab","prog");P("sige4:tab","progreso");P("sige:modo","fam");if(/^#\/bienestar$/.test(location.hash))history.replaceState(null,"","#/progreso")}}
leerBien();
function leerEnlace(){const m=/#p=([^&]+)/.exec(location.hash||"");if(!m)return false;try{const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(o&&o.url&&URL_OK(o.url)){P("mp1:url",o.url);P("sige:modo","fam")}}catch(e){}history.replaceState(null,"",location.pathname);return true}
leerEnlace();

/* ---------- Tema (misma clave de siempre: cdd1:theme) ---------- */
function temaActual(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function tema(t){t=(t==="light"||t==="dark")?t:"";if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;document.querySelectorAll("#modulos>div").forEach(h=>{if(t)h.dataset.theme=t;else delete h.dataset.theme});document.querySelector('meta[name="theme-color"]').content=temaActual()==="dark"?"#0e5c3b":"#0B4F7C"}
function cambiarTema(){const nx=temaActual()==="dark"?"light":"dark";P("cdd1:theme",nx);P("pev3:theme",nx);tema(nx)}

/* ---------- Sesión única (lee las sesiones que ya existen en el teléfono) ---------- */
const rnd=()=>Math.random().toString(36).slice(2,10);
function sesion(){
  let c=J("pev3:cfg",null);
  if(!(c&&c.url&&c.clave&&(c.rol==="dt"||c.rol==="asis"))){
    const d=J("cdd2:cfg",null);
    if(d&&d.url&&d.clave&&(d.rol==="dt"||d.rol==="asis")){
      if(c&&c.rol==="afic"){D("pev3:mirror");D("pev3:since")}
      c={url:d.url,clave:d.clave,rol:d.rol,uid:(c&&c.uid)||"u_"+rnd(),nombre:""};P("pev3:cfg",c);
    }else c=null;
  }
  if(c){if(!J("cdd2:cfg",null))P("cdd2:cfg",{url:c.url,clave:c.clave,rol:c.rol,desde:"sige"});P("sige4:ses",{rol:c.rol,nombre:c.nombre||""});return {rol:c.rol,nombre:c.nombre||"",url:c.url,clave:c.clave}}
  const s=J("mp1:ses",null),url=J("mp1:url","");
  if(s&&s.doc&&s.codigo&&url){const d=J("mp1:datos",null);const nombre=(d&&d.jugador&&(d.jugador.apodo||d.jugador.nombre))||"";P("sige4:ses",{rol:"fam",nombre});return {rol:"fam",nombre,url}}
  const g=J("sige4:inv",null);if(g&&g.url&&URL_OK(g.url))return {rol:"inv",nombre:"",url:g.url};
  return null;
}

/* ---------- Puente: una sola capa de acceso + cola sin señal ---------- */
async function post(url,body,ms){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||45000);
  try{return await fetch(url,{method:"POST",body:JSON.stringify(body),signal:ctl.signal,redirect:"follow"}).then(x=>x.json())}
  catch(e){const x=new Error("Sin señal o el puente no respondió. Intenta de nuevo.");x.red=true;throw x}finally{clearTimeout(t)}
}
const COLA="sige4:cola";
const SIGE={
  version:VERSION,
  sesion:()=>S.ses,
  /** Llama al puente con la sesión actual. {cola:true}: si no hay señal, guarda el pedido y lo envía después. */
  async llamar(body,o){
    o=o||{};const s=S.ses;if(!s)throw new Error("Sin sesión");
    const b=s.rol==="fam"?Object.assign({},J("mp1:ses",{}),body):Object.assign({clave:s.clave},body);
    const url=s.rol==="fam"?J("mp1:url",""):s.url;
    if(o.cola&&(!navigator.onLine||SIGE.pendientes()))return SIGE.encolar(url,b);
    let r;try{r=await post(url,b,o.ms)}catch(e){if(o.cola&&e.red)return SIGE.encolar(url,b);throw e}
    if(!r||!r.ok){const e=new Error((r&&(r.detalle||r.error))||"Error del puente");e.codigo=r&&r.error;if(e.codigo==="clave_incorrecta")avisar("La clave ya no es válida. Cierra sesión y vuelve a entrar.");throw e}
    return r;
  },
  encolar(url,b){const q=J(COLA,[]);q.push({url,b,ts:Date.now()});P(COLA,q);pintarNav();return {ok:true,enCola:true}},
  pendientes(){return J(COLA,[]).length},
  /** Envía en orden lo que quedó guardado sin señal. Se detiene en el primer fallo de red. */
  async vaciar(){
    if(SIGE._vaciando||!navigator.onLine)return;SIGE._vaciando=true;let enviados=0;
    try{for(;;){const q=J(COLA,[]);if(!q.length)break;const it=q[0];
      try{const r=await post(it.url,it.b,60000);if(!r||!r.ok){const e=J("sige4:colaErr",[]);e.push({op:it.b.op,error:r&&r.error,ts:Date.now()});P("sige4:colaErr",e.slice(-20))}}
      catch(e){break}
      const q2=J(COLA,[]);q2.shift();P(COLA,q2);enviados++}}
    finally{SIGE._vaciando=false}
    if(enviados){pintarNav();avisar(enviados===1?"Se envió 1 cambio guardado sin señal.":"Se enviaron "+enviados+" cambios guardados sin señal.")}
  }
};
SIGE.dialogo=dialogo;SIGE.toast=m=>avisar(m);
window.SIGE=SIGE;

/* ---------- v4.22 · Gol en vivo (familias e invitados, con la app abierta) ----------
   · Un gol es «nuevo» si su id no estaba entre los vistos de ESE partido (clave sige4:golVisto: {partido:[ids]}). En cada pantalla En vivo,
     lo primero que llega tras abrir la app es la línea base (se marca como visto, sin celebrar); lo que llega después se celebra una vez.
   · Franja «¡Gol!» (4 s) en un nodo fuera de #app (role=status): ningún repintado la corta ni la repite. Vibración breve si existe.
   · Sonido: apagado de fábrica (sige4:golSonido). El AudioContext se crea/reanuda SOLO al activar el interruptor (gesto del usuario)
     o en el primer toque tras abrir la app con el interruptor ya activo. Si está suspendido al llegar el gol, simplemente no suena. */
const GOL={clave:"sige4:golVisto",snd:"sige4:golSonido",base:{},ctx:null,t0:0,tz:0,zona:null};
function golCtx(){if(GOL.ctx)return GOL.ctx;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;try{GOL.ctx=new AC()}catch(e){GOL.ctx=null}return GOL.ctx}

  try{const t=c.currentTime,g=c.createGain();g.connect(c.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    [[659.25,0],[880,0.14]].forEach(([f,d])=>{const o=c.createOscillator();o.type="sine";o.frequency.setValueAtTime(f,t+d);o.connect(g);o.start(t+d);o.stop(t+d+0.3)})}catch(e){}}

  GOL.t0=Date.now();const z=golZona();z.innerHTML=`<div class="gol-franja"><b>¡Gol!</b>${nombre?`<span>${esc(nombre)}</span>`:""}</div>`;
  clearTimeout(GOL.tz);GOL.tz=setTimeout(()=>{z.innerHTML=""},4000);
  try{if(navigator.vibrate)navigator.vibrate([150,80,150])}catch(e){}
  if(SIGE.gol.sonido())golTono();
}
SIGE.gol={
  sonido:()=>J(GOL.snd,0)===1,
  /** Interruptor de sonido: al ACTIVAR (toque del usuario) se crea y reanuda el contexto de audio y suena una confirmación corta. */
  alternar(){const on=!SIGE.gol.sonido();
    if(on){P(GOL.snd,1);const c=golCtx();try{if(c&&c.resume){const r=c.resume();if(r&&r.then)r.then(golTono,()=>{});else golTono()}else golTono()}catch(e){}}
    else{D(GOL.snd);try{if(GOL.ctx&&GOL.ctx.suspend)GOL.ctx.suspend().catch(()=>{})}catch(e){}}
    return on},
  /** HTML del interruptor «Sonido de gol» (≥44 px, role=switch). El clic lo atiende data-a="gol-snd". */
  boton(){const on=SIGE.gol.sonido();return `<button class="gol-snd" role="switch" aria-checked="${on}" aria-label="Sonido de gol" data-a="gol-snd"><span aria-hidden="true">${on?"🔊":"🔇"}</span><span>Sonido de gol</span><b>${on?"Activado":"Apagado"}</b></button>`},
  /** Atributos del marcador: durante el primer segundo tras un gol, «salta» (el retardo negativo evita que un repintado reinicie la animación). */
  scAttr(){const el=Date.now()-GOL.t0;return GOL.t0&&el<900?`class="sc gol-salto" style="--gd:-${el}ms"`:'class="sc"'},
  /** Recibe cada vista del partido en vivo (familia o invitado). Celebra solo goles nuevos de Jaguares mientras se mira esta pantalla. */
  procesar(v){
    try{const pid=v&&v.actual;if(!pid)return;
      const gs=(v.eventos||[]).filter(e=>e&&e.tipo==="gol"&&e.id);
      const M=J(GOL.clave,{}),vistos=new Set(M[pid]||[]),nuevos=gs.filter(e=>!vistos.has(e.id)),base=!!GOL.base[pid];GOL.base[pid]=1;
      if(!nuevos.length)return;
      gs.forEach(e=>vistos.add(e.id));delete M[pid];M[pid]=[...vistos].slice(-40);
      Object.keys(M).slice(0,-6).forEach(k=>delete M[k]);P(GOL.clave,M);
      const rol=S.ses&&S.ses.rol,pant=rol==="inv"?"envivo":rol==="fam"?"vivo":"";
      if(!base||!pant||tabActual()!==pant||document.visibilityState!=="visible")return;
      const e=nuevos.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).pop(),j=(v.jugadores||[]).find(x=>x.id===e.jugador);
      golCelebrar(j?(j.dorsal?j.dorsal+" · ":"")+j.nombre:"");
    }catch(x){}}
};
// Con el interruptor ya activo al abrir la app, el primer toque reanuda el audio (los navegadores exigen un gesto)
if(SIGE.gol.sonido())addEventListener("click",()=>{if(SIGE.gol.sonido()){const c=golCtx();try{c&&c.resume&&c.resume().catch(()=>{})}catch(e){}}},{once:true,capture:true});

/* ---------- v4.20 · Diálogo propio: reemplaza confirm / prompt / alert (SIGE.dialogo) ----------
   SIGE.dialogo({modo:"confirmar"|"pedir"|"avisar", titulo, texto, ok, cancelar, peligro, valor, maxlength, placeholder}) → Promise
   · confirmar → true / false · pedir → la cadena escrita, o null si se cancela · avisar → undefined al cerrar.
   · El texto SIEMPRE se inserta como texto (textContent), nunca como HTML; admite saltos de línea.
   · Si se pide un diálogo mientras hay otro abierto, se encola. Una llamada idéntica (mismo modo, título y texto) a una abierta o
     en cola se resuelve de inmediato como «cancelar»: así un doble toque no abre dos diálogos ni confirma dos veces.
   · Toques con el puntero en los primeros 350 ms se ignoran (un doble toque no cae sobre el botón del diálogo recién abierto). */
const DLG={cola:[],ab:null,n:0};
function dialogo(o){o=o||{};const modo=o.modo==="pedir"||o.modo==="avisar"?o.modo:"confirmar",

  if(t.dataset.m){S.modo=t.dataset.m;S.err="";P("sige:modo",S.modo);render();return}
  const a=t.dataset.a;
  if(a==="salir")salir();
  else if(a==="invitado")entrarInv();
  else if(a==="noti-activar")notiActivar();
  else if(a==="bz-enviar")bzEnviar();
  else if(a==="bz-leida")bzMarcar(t.dataset.id,{estado:"leida"});
  else if(a==="bz-resp"){const id=t.dataset.id;dialogo({modo:"pedir",texto:"Tu respuesta (la verá quien la escribió):",valor:"",maxlength:400}).then(x=>{if(x!=null&&x.trim())bzMarcar(id,{estado:"respondida",resp:x.trim().slice(0,400)})})}
  else if(a==="bz-recargar")bzCargar(true);
  else if(a==="cu-recargar")cuCargar(true);
  else if(a==="tmp-cargar")tmpCargar();
  else if(a==="inv-recargar")invCargar(true);
  else if(a==="cu-jug"){location.hash="/cuerpo/"+t.dataset.id}
  else if(a==="cu-zona"){CU.sel={zona:t.dataset.z,lado:t.dataset.l,vista:t.dataset.v};CU.err="";render()}
  else if(a==="cu-otra"){CU.sel={zona:CU.zonas.find(z=>/^otra/i.test(z))||"Otra",lado:"",vista:"frente"};render()}
  else if(a==="cu-cancelar"){CU.sel=null;render()}
  else if(a==="cu-guardar")cuGuardar();
  else if(a==="cu-quitar")cuQuitar(t.dataset.id,false);
  else if(a==="cu-resuelta")cuQuitar(t.dataset.id,true);
  else if(a==="noti-quitar")notiQuitar();
  else if(a==="noti-pref")notiPref(t.dataset.k,t.checked);
  else if(a==="noti-borrar")notiBorrar([+t.dataset.ts]);
  else if(a==="noti-borrar-todas"){const L=(NOTI.items||[]).map(x=>x.ts);if(L.length)dialogo({texto:"¿Quitar las "+L.length+" notificaciones de tu campanita? Solo se quitan para ti.",ok:"Quitar",peligro:true}).then(si=>{if(si)notiBorrar(L)})}
  else if(a==="noti-ir"){const u=t.dataset.u||"";if(u)location.hash=u.replace(/^#/,"");}
  else if(a==="noti-wa"){window.open("https://wa.me/?text="+encodeURIComponent(t.dataset.w||""),"_blank")}
  else if(a==="noti-cfg")notiGuardarCfg();
  else if(a==="noti-prueba")notiPrueba();
  else if(a==="noti-inv")notiActivar(true);
  else if(a==="crec-nueva"){S.crecForm=true;S.crecErr="";S.crecVals={};render();window.scrollTo(0,0)}
  else if(a==="crec-ver"){S.crecVer=t.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="crec-volver"){S.crecForm=false;S.crecVer=null;render()}
  else if(a==="crec-guardar")crecGuardar();
  else if(a==="inv-salir")salirInv();
  else if(a==="inv-animo")invReac({e:"_animo"});
  else if(a==="gol-snd"){SIGE.gol.alternar();render()}
  else if(a==="inv-aplauso")invReac({e:t.dataset.ev,t:t.dataset.t});
  else if(a==="tema"){cambiarTema();render()}
  else if(a==="adp-cargar")adpCargar();
  else if(a==="tmp-resp")tmpRespaldo();
  else if(a==="tmp-nueva")tmpNueva();
  else if(a==="ins-compartir")insCompartir();
  else if(a==="ins-ya"){const e=INSTALAR;INSTALAR=null;if(e){e.prompt();e.userChoice.finally(()=>render())}}
  else if(a==="ins-login"){history.replaceState(null,"",location.pathname);render()}
  else if(a==="recargar")cargarInicio().then(render);
  else if(a==="vaciar")SIGE.vaciar().then(render);
});
$("thm").onclick=()=>{cambiarTema();if(S.ses&&NATIVA[tabActual()])render()};
$("upd").onclick=()=>cargarInicio();

/* ---------- Arranque ---------- */
tema(J("cdd1:theme",""));avisoEl();
if(!REDIR){
  S.ses=sesion();if(S.ses)P("sige:on",1);S.temp=J("sige4:temp",null);
  const cache=J("sige4:inicio",null);if(cache&&cache.d){S.ini.d=cache.d;S.ini.stamp=cache.stamp}
  render();
  if(S.ses&&S.ses.rol==="dt")cargarInicio();
  if(S.ses&&(S.ses.rol==="fam"||S.ses.rol==="asis"))setTimeout(()=>tbCargar(),2500);
  if(S.ses&&S.ses.rol==="inv")invCargar(true);
  if(ENLACE&&ENLACE.tipo==="ver"&&!S.ses)entrarInv(); // enlace viejo de padres → invitado
  SIGE.vaciar();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
})();
</script>
